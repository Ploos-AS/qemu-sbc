name: QEMU source prototype build

on:
  push:
    paths:
      - 'scripts/create-h2-prototype.py'
      - 'scripts/inspect-h3-reference.py'
      - 'scripts/verify-prototype-qmp.py'
      - 'scripts/verify-qemu-revision.sh'
      - 'scripts/verify-prototype-ram.py'
      - '.github/workflows/qemu-source-build.yml'
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev
      - name: Fetch pinned release tag
        run: |
          git clone --depth 1 --branch v10.0.0 https://gitlab.com/qemu-project/qemu.git _work/qemu
          git -C _work/qemu rev-parse HEAD | tee qemu-revision.txt
      - name: Verify exact source commit
        run: bash scripts/verify-qemu-revision.sh _work/qemu
      - name: Check reference sources
        run: python3 scripts/inspect-h3-reference.py --qemu-src _work/qemu
      - name: Generate prototype
        run: python3 scripts/create-h2-prototype.py --qemu-src _work/qemu --apply
      - name: Configure
        run: |
          mkdir -p _work/qemu/build
          cd _work/qemu/build
          ../configure --target-list=arm-softmmu --disable-werror --disable-docs
      - name: Build QEMU ARM
        run: ninja -C _work/qemu/build qemu-system-arm
      - name: Verify registration and QMP startup
        run: python3 scripts/verify-prototype-qmp.py _work/qemu/build/qemu-system-arm
      - name: Verify inherited H3 RAM restriction
        run: python3 scripts/verify-prototype-ram.py _work/qemu/build/qemu-system-arm
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-prototype-evidence
          path: |
            qemu-revision.txt
            qmp-output.txt
          if-no-files-found: ignore
