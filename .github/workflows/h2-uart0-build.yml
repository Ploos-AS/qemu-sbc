name: H2+ UART0 QEMU build integration

on:
  push:
    paths:
      - 'scripts/integrate-h2-uart0-meson.py'
      - 'tests/test_h2_uart0_meson.py'
      - '.github/workflows/h2-uart0-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test safe Meson integration
        run: python3 -m unittest discover -s tests -p 'test_h2_uart0_meson.py' -v
      - name: Install QEMU ARM build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev python3-venv
      - name: Fetch pinned QEMU v10.0.0
        run: |
          git clone --filter=blob:none --depth=1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu
      - name: Inject and register UART0 helper
        run: |
          python3 scripts/inject-h2-uart0.py --qemu-src qemu --apply
          python3 scripts/integrate-h2-uart0-meson.py --qemu-src qemu --apply
      - name: Compile ARM QEMU with helper
        run: |
          cd qemu
          ./configure --target-list=arm-softmmu --disable-docs --disable-werror
          ninja -C build qemu-system-arm
      - name: Record build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-uart0-qemu-build
          path: qemu/build/config-host.mak
          if-no-files-found: ignore
