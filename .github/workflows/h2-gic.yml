name: H2+ inherited GIC translation

on:
  push:
    paths:
      - 'scripts/translate-h2-gic.py'
      - 'tests/test_h2_gic.py'
      - '.github/workflows/h2-gic.yml'
  workflow_dispatch:

jobs:
  gic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test GIC specifier translation
        run: python3 -m unittest discover -s tests -p 'test_h2_gic.py' -v
      - name: Fetch pinned Linux v6.12 source descriptions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for entry in "sun8i-h3.dtsi:h3-inherited.dtsi" "sunxi-h3-h5.dtsi:h3-h5-shared.dtsi"; do
            source="${entry%%:*}"
            output="${entry##*:}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/torvalds/linux/contents/arch/arm/boot/dts/allwinner/$source?ref=v6.12" \
              --output "$output"
          done
      - name: Extract source interrupt specifiers
        run: python3 scripts/extract-h2-soc-details.py h3-inherited.dtsi h3-h5-shared.dtsi --output h2-soc-details.json
      - name: Translate GIC interrupt specifiers
        run: python3 scripts/translate-h2-gic.py h2-soc-details.json --output h2-gic-irqs.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-inherited-gic-translation
          path: |
            h2-soc-details.json
            h2-gic-irqs.json
          if-no-files-found: ignore
