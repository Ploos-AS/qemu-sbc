name: H2+ UART0 QEMU source helper

on:
  push:
    paths:
      - 'scripts/inject-h2-uart0.py'
      - 'tests/test_h2_uart0_injection.py'
      - '.github/workflows/h2-uart0-injection.yml'
  workflow_dispatch:

jobs:
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test source injection
        run: python3 -m unittest discover -s tests -p 'test_h2_uart0_injection.py' -v
