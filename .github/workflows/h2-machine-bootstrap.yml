name: H2+ independent machine bootstrap

on:
  push:
    paths:
      - 'scripts/inject-h2-machine-bootstrap.py'
      - 'tests/test_h2_machine_bootstrap.py'
      - 'tests/qtest_h2_bootstrap.py'
      - '.github/workflows/h2-machine-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Offline bootstrap safety tests
        run: python3 -m unittest discover -s tests -p 'test_h2_machine_bootstrap.py' -v
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev python3-venv
      - name: QEMU 10.0.0
        run: git clone --filter=blob:none --depth=1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu
      - name: Inject independent H2+ machine
        run: |
          python3 scripts/inject-h2-machine-bootstrap.py --qemu-src qemu --apply
          python3 scripts/inject-h2-machine-bootstrap.py --qemu-src qemu --apply
      - name: Build
        run: |
          cd qemu
          ./configure --target-list=arm-softmmu --disable-docs --disable-werror
          ninja -C build qemu-system-arm
      - name: Verify independent machine registration
        run: |
          qemu/build/qemu-system-arm -machine help | grep 'orangepi-zero-lts-h2'
      - name: Smoke-test independent machine startup
        timeout-minutes: 2
        run: |
          python3 tests/qtest_h2_bootstrap.py --qemu qemu/build/qemu-system-arm
