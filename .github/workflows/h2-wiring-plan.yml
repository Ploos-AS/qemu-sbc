name: H2+ inherited MMIO IRQ wiring plan

on:
  push:
    paths:
      - 'scripts/build-h2-wiring-plan.py'
      - '.github/workflows/h2-wiring-plan.yml'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Linux v6.12 inherited DTSI files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for entry in "sun8i-h3.dtsi:h3-inherited.dtsi" "sunxi-h3-h5.dtsi:h3-h5-shared.dtsi"; do
            source="${entry%%:*}"
            output="${entry##*:}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/torvalds/linux/contents/arch/arm/boot/dts/allwinner/$source?ref=v6.12" \
              --output "$output"
          done
      - name: Extract register and interrupt details
        run: python3 scripts/extract-h2-soc-details.py h3-inherited.dtsi h3-h5-shared.dtsi --output h2-soc-details.json
      - name: Translate GIC specifiers
        run: python3 scripts/translate-h2-gic.py h2-soc-details.json --output h2-gic-irqs.json
      - name: Build checked wiring plan
        run: python3 scripts/build-h2-wiring-plan.py h2-soc-details.json h2-gic-irqs.json --output h2-wiring-plan.json
      - name: Upload plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-wiring-plan
          path: |
            h2-soc-details.json
            h2-gic-irqs.json
            h2-wiring-plan.json
          if-no-files-found: ignore
