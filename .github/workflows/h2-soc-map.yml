name: H2+ SoC register inventory

on:
  push:
    paths:
      - 'scripts/extract-h2-soc-map.py'
      - '.github/workflows/h2-soc-map.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Linux v6.12 inherited H3 SoC description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/torvalds/linux/contents/arch/arm/boot/dts/allwinner/sun8i-h3.dtsi?ref=v6.12" \
            --output h3-inherited.dtsi
          sha256sum h3-inherited.dtsi > h3-inherited.sha256
      - name: Extract peripheral address inventory
        run: python3 scripts/extract-h2-soc-map.py h3-inherited.dtsi --output h2-soc-registers.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-inherited-soc-map
          path: |
            h3-inherited.dtsi
            h3-inherited.sha256
            h2-soc-registers.json
          if-no-files-found: ignore
